name: Deploy Bot to VPS

on:
  push:
    branches:
      - feature/#1_ci_cd

jobs:
  # checkout the repository
  checkout:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.workspace.outputs.workspace-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - id: workspace
        run: echo "workspace-path=${{ github.workspace }}" >> $GITHUB_ENV

  checkout_and_notify:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.workspace.outputs.workspace-path }}
    env:
      COMMIT_MESSAGE: $(git log -1 --pretty=%B | jq -sRr @uri)
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - id: workspace
      run: echo "workspace-path=${{ github.workspace }}" >> $GITHUB_ENV

    - name: Notify Deployment Start
      run: |
        start_msg="🚀 Deployment Start for: ${{ github.repository }} on branch ${{ github.ref_name }}%0A☑️Commit: ${{ env.COMMIT_MESSAGE }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${start_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}"



  # copy project files to the VPS
  copy_files:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Copy project files
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ github.workspace }}
          target: ~/Catebi.ScheduleBot

  # deploy and restart using docker-compose
  deploy:
    runs-on: ubuntu-latest
    needs: copy_files
    steps:
      - name: Deploy and restart
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Catebi.ScheduleBot
            echo "Updating .env file..."
            cat <<EOF > .env
            API_ID=${{ secrets.TELEGRAM_API_ID }}
            API_HASH=${{ secrets.TELEGRAM_API_HASH }}
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            AIRTABLE_API_KEY=${{ secrets.AIRTABLE_APIKEY }}
            AIRTABLE_BASE_ID=${{ secrets.AIRTABLE_BASEID }}
            EOF
            echo "Pulling Docker images..."
            docker-compose down
            docker-compose up -d

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Notify Deployment and Healthcheck Result
      if: success()
      run: |
        echo "Deployment and healthcheck passed"
        msg="✅ Successful Deployment and Healthcheck Passed: %0A🤖${{ github.repository }} at <code>${{ github.sha }}</code>"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}&parse_mode=HTML"
    - name: Notify Deployment Failure
      if: failure()
      run: |
        failure_msg="❌ Deployment Failed: Check the actions log for details.%0AView Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${failure_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}"
