name: Deploy Bot to VPS

on:
  push:
    branches:
      - main

jobs:
  # checkout the repository
  checkout_and_notify:
    runs-on: ubuntu-latest
    env:
      COMMIT_MESSAGE: $(git log -1 --pretty=%B | jq -sRr @uri)
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Notify Deployment Start
        run: |
          start_msg="🚀 Deployment Start for: <code>${{ github.repository }}</code> on branch <code>${{ github.ref_name }}</code>%0A☑️Commit: ${{ env.COMMIT_MESSAGE }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${start_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}&parse_mode=HTML"


  # copy project files to the VPS
  copy_files:
    runs-on: ubuntu-latest
    needs: checkout_and_notify
    steps:
      - name: Copy project files
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .
          target: ~/Catebi.ScheduleBot

  # deploy and restart using docker-compose
  build_and_deploy:
    runs-on: ubuntu-latest
    needs: copy_files
    steps:
      - name: Deploy and restart
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Catebi.ScheduleBot
            echo "Updating .env file..."
            cat <<EOF > .env
            API_ID=${{ secrets.TELEGRAM_API_ID }}
            API_HASH=${{ secrets.TELEGRAM_API_HASH }}
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            AIRTABLE_API_KEY=${{ secrets.AIRTABLE_APIKEY }}
            AIRTABLE_BASE_ID=${{ secrets.AIRTABLE_BASEID }}
            EOF
            echo "Pulling Docker images..."
            docker-compose down
            docker-compose up --build -d

  # notify the deployment status to the telegram group
  notify:
    runs-on: ubuntu-latest
    needs: build_and_deploy
    steps:
    - name: Notify Deployment
      if: success()
      run: |
        echo "Deployment passed"
        msg="✅ Successful Deployment passed: %0A🤖<code>${{ github.repository }}</code> at <code>${{ github.sha }}</code>"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}&parse_mode=HTML"
    - name: Notify Deployment Failure
      if: failure()
      run: |
        failure_msg="❌ Deployment Failed: Check the actions log for details.%0AView Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ vars.IT_TELEGRAM_CHAT_ID }}&text=${failure_msg}&message_thread_id=${{ vars.IT_TELEGRAM_CHAT_NOTIFY_TOPIC_ID }}&parse_mode=HTML"
