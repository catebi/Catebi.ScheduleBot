[project]
name = "catebi-schedulebot"
version = "0.1.0"
description = "Telegram bot for scheduling volunteer shifts at Catebi cat shelter."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "scripts"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by the formatter
    "E722",   # bare except is used deliberately in a few spots (preserved behavior)
    "B008",   # function calls in argument defaults (not an issue here)
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
